openapi: 3.0.3
info:
  title: intentflow review contract
  version: 0.2.0
  description: Local Git diff and persistent pull-request-style reviews.

servers:
  - url: http://127.0.0.1:8123

paths:
  /api/payload:
    get:
      summary: Full review payload
      operationId: getPayload
      parameters:
        - in: query
          name: revision
          description: Revision id from /api/revisions (range, worktree, or commit:<sha>).
          schema: { type: string }
      responses:
        '200':
          description: Review facts, behavior graph and source bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payload'
  /api/revisions:
    get:
      summary: Commits in the comparison plus the uncommitted worktree entry
      operationId: getRevisions
      responses:
        '200':
          description: Available revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
  /api/review/state:
    put:
      summary: Save or import a review for a matching repository, branch and diff
      operationId: saveReviewSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSession' }
      responses:
        '200':
          description: Atomically saved review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSession' }
        '409':
          description: Repository, branch or comparison does not match
  /api/review/drafts:
    get:
      summary: Other saved drafts for the same branch session
      operationId: listReviewDrafts
      responses:
        '200':
          description: Drafts for the current session, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDraftList' }
  /api/review/drafts/{comparison_id}:
    post:
      summary: Restore another draft of the same branch into the current comparison
      operationId: restoreReviewDraft
      parameters:
        - in: path
          name: comparison_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Draft now saved as the current comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
        '409':
          description: Some comments no longer match the current diff
  /api/review/assets:
    post:
      summary: Upload an image attached to a review comment
      operationId: uploadReviewAsset
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored asset name and URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewAsset' }
  /api/review/assets/{name}:
    get:
      summary: Read an uploaded review image
      operationId: getReviewAsset
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
  /api/review:
    post:
      summary: Write the review JSON to the output directory
      operationId: postReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: review.md written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

components:
  schemas:
    Confidence:
      type: string
      enum: [EXTRACTED, DERIVED, INFERRED, ASSERTED, UNKNOWN]
    Layer:
      type: string
      enum: [project, logic, intent]
    Severity:
      type: string
      enum: [info, warn, high]
    DeltaKind:
      type: string
      enum: [added, removed, modified, unchanged]
    CodeStatus:
      type: string
      enum: [added, removed, modified, unchanged]
    BehaviorRole:
      type: string
      enum: [trigger, decision, transform, effect]
    BehaviorEdgeKind:
      type: string
      enum: [call, data, control, boundary]
    Side:
      type: string
      enum: [before, after]

    Fact:
      type: object
      additionalProperties: false
      required:
        [identity, layer, kind, title, detail, file, line, function, confidence,
         path, source, category, shape, snippet]
      properties:
        identity: { type: string }
        layer: { $ref: '#/components/schemas/Layer' }
        kind: { type: string }
        title: { type: string }
        detail: { type: string }
        file: { type: string }
        line: { type: integer, format: int32 }
        function: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }
        path:
          type: array
          items: { type: string }
        source: { type: string }
        category: { type: string }
        shape: { type: string }
        snippet: { type: string }

    Delta:
      type: object
      additionalProperties: false
      required: [added, removed]
      properties:
        added:
          type: array
          items: { $ref: '#/components/schemas/Fact' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/Fact' }

    RevisionKind:
      type: string
      enum: [range, commit, worktree]

    Revision:
      type: object
      additionalProperties: false
      required: [id, kind, label, sha, short, subject, author, date, files]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/RevisionKind' }
        label: { type: string }
        sha: { type: string }
        short: { type: string }
        subject: { type: string }
        author: { type: string }
        date: { type: string }
        files: { type: integer, format: int32 }

    RevisionList:
      type: object
      additionalProperties: false
      required: [base, head, current, dirty, revisions]
      properties:
        base: { type: string }
        head: { type: string }
        current: { type: string }
        dirty: { type: boolean }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/Revision' }

    ScanMode:
      type: string
      enum: [diff, scan, review]

    ScanStatus:
      type: string
      enum: [pending, running, ok, error, skipped]

    ScanState:
      type: object
      additionalProperties: false
      required: [mode, status, rules, files, findings, started_at, finished_at, message]
      properties:
        mode: { $ref: '#/components/schemas/ScanMode' }
        status: { $ref: '#/components/schemas/ScanStatus' }
        rules: { type: integer, format: int32 }
        files: { type: integer, format: int32 }
        findings: { type: integer, format: int32 }
        started_at: { type: string }
        finished_at: { type: string }
        message: { type: string }

    Finding:
      type: object
      additionalProperties: false
      required: [id, rule, title, category, category_title, severity, engine, file, line, snippet]
      properties:
        id: { type: string }
        rule: { type: string }
        title: { type: string }
        category: { type: string }
        category_title: { type: string }
        severity: { type: string }
        engine: { type: string }
        file: { type: string }
        line: { type: integer, format: int32 }
        snippet: { type: string }

    ScanResponse:
      type: object
      additionalProperties: false
      required: [scan, findings, ai]
      properties:
        scan: { $ref: '#/components/schemas/ScanState' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        ai: { $ref: '#/components/schemas/AiSummary' }

    Signal:
      type: object
      additionalProperties: false
      required: [id, severity, title, detail, evidence, confidence]
      properties:
        id: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        detail: { type: string }
        evidence:
          type: array
          items: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }

    BehaviorNode:
      type: object
      additionalProperties: false
      required:
        [id, role, stage, label, detail, file, line, function, package, delta,
         confidence, evidence, tags, snippet, source, shape, category, change]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/BehaviorRole' }
        stage: { type: integer, format: int32 }
        label: { type: string }
        detail: { type: string }
        file: { type: string }
        line: { type: integer, format: int32 }
        function: { type: string }
        package: { type: string }
        delta: { $ref: '#/components/schemas/DeltaKind' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        evidence:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        snippet: { type: string }
        source: { type: string }
        shape: { type: string }
        category: { type: string }
        change: { type: string }

    BehaviorEdge:
      type: object
      additionalProperties: false
      required:
        [id, from, to, kind, label, shape, source, scenario, delta, confidence, evidence]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind: { $ref: '#/components/schemas/BehaviorEdgeKind' }
        label: { type: string }
        shape: { type: string }
        source: { type: string }
        scenario: { type: string }
        delta: { $ref: '#/components/schemas/DeltaKind' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        evidence:
          type: array
          items: { type: string }

    BehaviorScenario:
      type: object
      additionalProperties: false
      required: [id, trigger, effect, title, delta, nodes, source, shape, category]
      properties:
        id: { type: string }
        trigger: { type: string }
        effect: { type: string }
        title: { type: string }
        delta: { $ref: '#/components/schemas/DeltaKind' }
        nodes:
          type: array
          items: { type: string }
        source: { type: string }
        shape: { type: string }
        category: { type: string }

    BehaviorLane:
      type: object
      additionalProperties: false
      required: [role, label, description, order, count]
      properties:
        role: { $ref: '#/components/schemas/BehaviorRole' }
        label: { type: string }
        description: { type: string }
        order: { type: integer, format: int32 }
        count: { type: integer, format: int32 }

    BehaviorStats:
      type: object
      additionalProperties: false
      required: [nodes, edges, scenarios, added, removed, modified]
      properties:
        nodes: { type: integer, format: int32 }
        edges: { type: integer, format: int32 }
        scenarios: { type: integer, format: int32 }
        added: { type: integer, format: int32 }
        removed: { type: integer, format: int32 }
        modified: { type: integer, format: int32 }

    BehaviorGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges, scenarios, lanes, entry, stageCount, stats]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/BehaviorNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/BehaviorEdge' }
        scenarios:
          type: array
          items: { $ref: '#/components/schemas/BehaviorScenario' }
        lanes:
          type: array
          items: { $ref: '#/components/schemas/BehaviorLane' }
        entry: { type: string }
        stageCount: { type: integer, format: int32 }
        stats: { $ref: '#/components/schemas/BehaviorStats' }

    Review:
      type: object
      additionalProperties: false
      required: [before, after, project, logic, intent, signals, notes, behavior, ai, comparison, symbols, scan, findings]
      properties:
        before: { type: string }
        after: { type: string }
        project: { $ref: '#/components/schemas/Delta' }
        logic: { $ref: '#/components/schemas/Delta' }
        intent: { $ref: '#/components/schemas/Delta' }
        signals:
          type: array
          items: { $ref: '#/components/schemas/Signal' }
        notes:
          type: array
          items: { type: string }
        behavior: { $ref: '#/components/schemas/BehaviorGraph' }
        ai: { $ref: '#/components/schemas/AiSummary' }
        comparison: { $ref: '#/components/schemas/Comparison' }
        symbols: { $ref: '#/components/schemas/SymbolGraph' }
        scan: { $ref: '#/components/schemas/ScanState' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }

    ComparisonMode:
      type: string
      enum: [folder, git]

    Commit:
      type: object
      additionalProperties: false
      required: [sha, short, subject, author, date, parents]
      properties:
        sha: { type: string }
        short: { type: string }
        subject: { type: string }
        author: { type: string }
        date: { type: string }
        parents:
          type: array
          items: { type: string }

    Comparison:
      type: object
      additionalProperties: false
      required: [mode, beforeLabel, afterLabel, commits, selected, note]
      properties:
        mode: { $ref: '#/components/schemas/ComparisonMode' }
        beforeLabel: { type: string }
        afterLabel: { type: string }
        repo: { type: string }
        subdir: { type: string }
        baseRef: { type: string }
        headRef: { type: string }
        commits:
          type: array
          items: { $ref: '#/components/schemas/Commit' }
        selected:
          type: array
          items: { type: string }
        note: { type: string }

    SymbolKind:
      type: string
      enum: [function, type]

    SymbolEdgeKind:
      type: string
      enum: [call]

    SymbolNode:
      type: object
      additionalProperties: false
      required: [id, kind, name, package, file, line, delta, signature, callers, callees, members, exported]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/SymbolKind' }
        name: { type: string }
        package: { type: string }
        file: { type: string }
        line: { type: integer, format: int32 }
        delta: { $ref: '#/components/schemas/DeltaKind' }
        signature: { type: string }
        callers: { type: integer, format: int32 }
        callees: { type: integer, format: int32 }
        members:
          type: array
          items: { type: string }
        exported: { type: boolean }

    SymbolEdge:
      type: object
      additionalProperties: false
      required: [id, from, to, kind, delta, line, resolved]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        kind: { $ref: '#/components/schemas/SymbolEdgeKind' }
        delta: { $ref: '#/components/schemas/DeltaKind' }
        line: { type: integer, format: int32 }
        resolved: { type: boolean }

    SymbolRef:
      type: object
      additionalProperties: false
      required: [name, from, file, line]
      properties:
        name: { type: string }
        from: { type: string }
        file: { type: string }
        line: { type: integer, format: int32 }

    SymbolStats:
      type: object
      additionalProperties: false
      required: [functions, types, calls, unresolved]
      properties:
        functions: { type: integer, format: int32 }
        types: { type: integer, format: int32 }
        calls: { type: integer, format: int32 }
        unresolved: { type: integer, format: int32 }

    SymbolGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges, unresolved, stats]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/SymbolNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/SymbolEdge' }
        unresolved:
          type: array
          items: { $ref: '#/components/schemas/SymbolRef' }
        stats: { $ref: '#/components/schemas/SymbolStats' }

    AiSummary:
      type: object
      additionalProperties: false
      required: [status, model, summary, modules, risks, focus, generated_at]
      properties:
        status: { type: string, enum: [ok, unavailable, error, pending] }
        model: { type: string }
        summary: { type: string }
        modules:
          type: array
          items: { $ref: '#/components/schemas/AiModule' }
        risks:
          type: array
          items: { $ref: '#/components/schemas/AiRisk' }
        focus:
          type: array
          items: { type: string }
        generated_at: { type: string }

    AiModule:
      type: object
      additionalProperties: false
      required: [name, files, change]
      properties:
        name: { type: string }
        files:
          type: array
          items: { type: string }
        change: { type: string }

    AiRisk:
      type: object
      additionalProperties: false
      required: [title, detail, evidence]
      properties:
        title: { type: string }
        detail: { type: string }
        evidence:
          type: array
          items: { type: string }

    CodeFile:
      type: object
      additionalProperties: false
      required: [path, status, language, before, after]
      properties:
        path: { type: string }
        status: { $ref: '#/components/schemas/CodeStatus' }
        language: { type: string }
        before: { type: string }
        after: { type: string }

    CodeBundle:
      type: object
      additionalProperties: false
      required: [root, files, truncated, skipped]
      properties:
        root: { type: string }
        files:
          type: array
          items: { $ref: '#/components/schemas/CodeFile' }
        truncated: { type: boolean }
        skipped:
          type: array
          items: { type: string }

    Payload:
      type: object
      additionalProperties: false
      required: [review, code, session]
      properties:
        review: { $ref: '#/components/schemas/Review' }
        code: { $ref: '#/components/schemas/CodeBundle' }
        session: { $ref: '#/components/schemas/ReviewSession' }

    ReviewContext:
      type: object
      additionalProperties: false
      required: [session_id, comparison_id, repository, branch, base, head, revision, subdir, diff_digest]
      properties:
        session_id: { type: string }
        comparison_id: { type: string }
        repository: { type: string }
        branch: { type: string }
        base: { type: string }
        head: { type: string }
        revision: { type: string }
        subdir: { type: string }
        diff_digest: { type: string }

    ReviewSession:
      type: object
      additionalProperties: false
      required: [version, context, comments, viewed, reviewed_hunks, updated_at]
      properties:
        version: { type: integer, format: int32 }
        context: { $ref: '#/components/schemas/ReviewContext' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        viewed:
          type: array
          description: Reviewed files, formatted as <file path>#<content digest>.
          items: { type: string }
        reviewed_hunks:
          type: array
          description: Reviewed hunks, formatted as <file path>@<row index>#<hunk digest>.
          items: { type: string }
        updated_at: { type: string }

    CommitList:
      type: object
      additionalProperties: false
      required: [mode, commits, selected, note]
      properties:
        mode: { $ref: '#/components/schemas/ComparisonMode' }
        repo: { type: string }
        subdir: { type: string }
        baseRef: { type: string }
        headRef: { type: string }
        commits:
          type: array
          items: { $ref: '#/components/schemas/Commit' }
        selected:
          type: array
          items: { type: string }
        note: { type: string }

    Quote:
      type: object
      additionalProperties: false
      required: [file, side, start, end, snippet]
      properties:
        file: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        start: { type: integer, format: int32 }
        end: { type: integer, format: int32 }
        snippet: { type: string }

    Comment:
      type: object
      additionalProperties: false
      required: [id, text, title, source, signalId, createdAt, images]
      properties:
        id: { type: string }
        text: { type: string }
        title: { type: string }
        source: { type: string, enum: [manual, signal, ai] }
        signalId: { type: string }
        createdAt: { type: integer, format: int64 }
        quote: { $ref: '#/components/schemas/Quote' }
        resolved: { type: boolean, default: false }
        images:
          type: array
          items: { type: string }

    ReviewState:
      type: object
      additionalProperties: false
      required: [comments, dismissed, kept]
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        dismissed:
          type: array
          items: { type: string }
        kept:
          type: array
          items: { type: string }

    ReviewRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: '#/components/schemas/ReviewSession' }

    ReviewAsset:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    ReviewDraft:
      type: object
      additionalProperties: false
      required: [comparison_id, revision, base, head, updated_at, comments]
      properties:
        comparison_id: { type: string }
        revision: { type: string }
        base: { type: string }
        head: { type: string }
        updated_at: { type: string }
        comments: { type: integer }

    ReviewDraftList:
      type: object
      additionalProperties: false
      required: [session_id, drafts]
      properties:
        session_id: { type: string }
        drafts:
          type: array
          items: { $ref: '#/components/schemas/ReviewDraft' }

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [relax]
      properties:
        relax: { type: boolean }

    RestoreResult:
      type: object
      additionalProperties: false
      required: [document, adjusted]
      properties:
        document: { $ref: '#/components/schemas/ReviewSession' }
        adjusted: { type: integer }

    ReviewResponse:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
