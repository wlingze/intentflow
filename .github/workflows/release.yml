name: release

# 打 tag 即发布：v0.1.0 会产出 6 个平台二进制与校验和。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布或覆盖的 tag
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 前端只构建一次：所有目标平台共用同一份 embed 产物。
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          touch dist/.gitkeep

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        env:
          VERSION: ${{ steps.v.outputs.version }}
          COMMIT: ${{ steps.v.outputs.commit }}
          DATE: ${{ steps.v.outputs.date }}
        run: |
          set -euo pipefail
          ldflags="-s -w \
            -X github.com/wlingze/intentflow/internal/version.Version=${VERSION} \
            -X github.com/wlingze/intentflow/internal/version.Commit=${COMMIT} \
            -X github.com/wlingze/intentflow/internal/version.Date=${DATE}"
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%/*}"; arch="${target#*/}"
            bin="intentflow"
            [ "$os" = windows ] && bin="intentflow.exe"
            out="dist/${os}_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$out/$bin" ./cmd/intentflow
          done

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          cp ../LICENSE ../README.md linux_amd64/
          for dir in */; do
            target="${dir%/}"
            case "$target" in
              windows_*) (cd "$target" && zip -q "../intentflow_${VERSION}_${target}.zip" ./*) ;;
              *) (cd "$target" && tar -czf "../intentflow_${VERSION}_${target}.tar.gz" ./*) ;;
            esac
          done
          sha256sum intentflow_* > checksums.txt
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/intentflow_* dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/intentflow_* dist/checksums.txt \
              --title "intentflow ${TAG#v}" \
              --generate-notes \
              --notes "前端已内嵌，下载即用。\`intentflow version\` 可确认构建版本。"
          fi
